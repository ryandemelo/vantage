<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vantage. AI usage report</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }
    header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .controls select { width: auto; min-width: 150px; }
    .custom { display: none; gap: 6px; align-items: center; }
    .custom.on { display: flex; }
    .custom input { width: 145px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 780px) { .grid2 { grid-template-columns: 1fr; } }
    .chart { width: 100%; height: 110px; display: block; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }
    .samples td { vertical-align: top; }
    .samples .txt { font-size: 12px; color: var(--muted); max-width: 460px; }
    .exec { display: flex; flex-direction: column; gap: 2px; }
    .exec-row { padding: 11px 0; border-bottom: 1px solid var(--border); }
    .exec-row:last-child { border-bottom: none; padding-bottom: 0; }
    .exec-q { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
    .exec-a { font-size: 15px; margin-top: 4px; line-height: 1.55; }
    .exec-m { font-size: 12px; color: var(--faint); margin-top: 4px; font-style: italic; }
  </style>
</head>
<body>
<div class="page">

  <header class="top">
    <div>
      <h1>AI usage report</h1>
      <div class="faint" id="rangeLabel"></div>
    </div>
    <div class="controls no-print">
      <select id="period">
        <option value="this-week">This week</option>
        <option value="last-week" selected>Last week</option>
        <option value="this-month">This month</option>
        <option value="last-month">Last month</option>
        <option value="last-30">Last 30 days</option>
        <option value="all-time">All time</option>
        <option value="custom">Custom range…</option>
      </select>
      <span class="custom" id="customWrap">
        <input type="date" id="fromDate"><span class="faint">to</span><input type="date" id="toDate">
        <button class="sm" id="applyCustom">Apply</button>
      </span>
    </div>
  </header>

  <div class="stack" id="content"></div>

  <div class="empty" id="empty" style="display:none">
    <p>No activity captured in this period.</p>
    <p class="faint">Open Claude, ChatGPT or Gemini and send a prompt, it will appear here.</p>
  </div>

</div>

<script src="../core/schema.js"></script>
<script src="../core/redact.js"></script>
<script src="../core/classify.js"></script>
<script src="../core/adapters.js"></script>
<script src="../core/surfaces.js"></script>
<script src="../core/db.js"></script>
<script src="../core/report.js"></script>
<script src="../core/sign.js"></script>
<script src="reports.js"></script>
</body>
</html>
